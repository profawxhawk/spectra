root = "."
tmp_dir = "tmp"

[build]
  full_bin = "./tmp/spectra serve --config spectra.yaml"
  cmd = "go build -o ./tmp/spectra ./cmd/spectra"
  delay = 1000
  exclude_dir = ["tmp", "bin", "web", "node_modules", "vendor", ".git"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "yaml"]
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true

[color]
  build = "yellow"
  main = "cyan"
  runner = "green"
  watcher = "magenta"

[misc]
  clean_on_exit = true
